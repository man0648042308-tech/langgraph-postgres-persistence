[project]
name = "bankrs-"
version = "0.1.0"
description = "/银行推荐系统、记忆与检查点综合作业"
requires-python = ">=3.13"
dependencies = [
    "langgraph>=1.2.0,<2",
    "langgraph-checkpoint-sqlite>=3.0.0,<4",
    "langgraph-checkpoint-postgres>=3.0.0,<4",
    "langmem>=0.0.30,<1",
    "psycopg[binary,pool]>=3.2.0,<4",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

